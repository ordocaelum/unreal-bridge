name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }} / ${{ matrix.mcp }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
        mcp: ["mcp>=2"]
        include:
          - { os: ubuntu-latest, python: "3.11", mcp: "mcp>=1.10,<2" }
          - { os: windows-latest, python: "3.11", mcp: "mcp>=1.10,<2" }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[test]" "${{ matrix.mcp }}"
      - name: Test
        run: python -m pytest -rs
